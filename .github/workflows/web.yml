name: web

on:
  push:
    branches: [main]
    paths: [web/**, biome.json, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, biome.json, .github/workflows/web.yml]

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: unico-linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - if: hashFiles('web/package.json') != ''
        run: |
          npm ci
          npm run lint
          npm run build --if-present
          npm test --if-present
      # Each journey mode lives in its own folder. Delete one at a time and check the app still works without it.
      - if: hashFiles('web/package.json') != ''
        run: |
          for mode in journey/*/; do
            copy="$RUNNER_TEMP/without-$(basename "$mode")"
            cp -R . "$copy"
            rm -rf "$copy/$mode"
            echo "Testing without $mode"
            (cd "$copy" && npm test)
          done
