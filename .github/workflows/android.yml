name: android

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, .github/workflows/android.yml]

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: hashFiles('android/gradlew') != ''
        run: ./gradlew build
