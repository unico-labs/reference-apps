name: android

on:
  workflow_call:

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: unico-linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: hashFiles('android/gradlew') != ''
        run: ./gradlew build
