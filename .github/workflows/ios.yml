name: ios

on:
  workflow_call:

defaults:
  run:
    working-directory: ios

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('ios/**/project.pbxproj') != ''
        run: xcodebuild build -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
