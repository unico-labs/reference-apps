name: flows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  copies-match:
    runs-on: unico-linux
    steps:
      - uses: actions/checkout@v7
      - run: jq empty flows.json
      - run: |
          status=0
          for copy in $(git ls-files '*/flows.json'); do
            cmp -s flows.json "$copy" || { echo "::error file=$copy::differs from root flows.json"; status=1; }
          done
          exit $status
