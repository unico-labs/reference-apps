name: flutter

on:
  workflow_call:

defaults:
  run:
    working-directory: flutter

jobs:
  build:
    runs-on: unico-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: |
          flutter pub get
          flutter analyze
          flutter test
